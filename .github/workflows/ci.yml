# Checks every push and pull request: types, the test suite against a real Postgres
# (with the project's migrations and row level security), the coach function, a
# production build, and the browser tests on a phone-sized screen.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Coach function compiles
        run: npx -y deno check --node-modules-dir=none coach/index.ts
        working-directory: supabase/functions
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://localhost:54421
          VITE_SUPABASE_ANON_KEY: anon
      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Keep failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/output
          if-no-files-found: ignore
